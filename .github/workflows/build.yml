name: Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show commit and search for tinypinyin
      run: |
        echo "Building commit: $(git rev-parse HEAD)"
        echo ""
        echo "===== every 'tinypinyin' mention in the repo (any file) ====="
        grep -rn "tinypinyin" . --exclude-dir=.git || echo "(no matches found)"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Dependency insight for tinypinyin
      run: ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency com.github.promeg:tinypinyin --no-build-cache
      continue-on-error: true

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --refresh-dependencies --no-build-cache

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AppOpsX-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        
