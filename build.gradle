// Top-level build file where you can add configuration options com.zzzmode.appopsx.common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

project.ext {
    buildToolsVersion = "${BUILD_TOOLS_VERSION}"
    compileSdkVersion = COMPILE_SDK_VERSION.toInteger()
    minSdkVersion = MIN_SDK_VERSION.toInteger();
    targetSdkVersion = TARGET_SDK_VERSION.toInteger();
    versionCode = APP_VERSION_CODE.toInteger();
    versionName = "${VERSION_NAME}"
    supportLibVersion = "${SUPPORT_LIB_VERSION}"
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        // Last resort: mirrors old jcenter/bintray-era artifacts (e.g. tinypinyin) that
        // never made it to mavenCentral. Kept last since it's occasionally flaky and
        // everything else should resolve from the repos above anyway.
        maven { url "https://maven.aliyun.com/repository/public" }

    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
